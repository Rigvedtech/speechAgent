# Production deploy to Azure VM on push/merge to main.
#
# Flow (see scripts/deploy-vm.sh for full logic):
#   1. SSH into VM
#   2. git fetch + reset to origin/main (so latest scripts/deploy-vm.sh exists)
#   3. bash scripts/deploy-vm.sh
#        stop API → pull → pip → migrate (dump only if pending) → start API
#        → npm ci/build → publish to nginx → health checks
#
# Why a separate script?
#   appleboy/ssh-action runs inline YAML via bash -c '...'. Complex shell
#   (single quotes, case/;;, redirects) breaks there. The deploy script runs
#   as a normal file and is safe.
#
# Required GitHub Actions secrets:
#   VM_HOST, VM_USER, VM_SSH_KEY
#
# VM prerequisites (one-time):
#   - repo at /home/azureuser/speechAgent
#   - backend/.env with DATABASE_URL
#   - frontend/.env.production
#   - systemd speechagent-api, nginx /var/www/speechagent
#   - postgresql-client (pg_dump)
#   - passwordless sudo for systemctl/cp/mkdir/chown
#
# Dev branch middleware_layer does NOT deploy. Merge/push to main only.

name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to run production deploy to the VM"
        required: true
        default: "deploy"

concurrency:
  group: deploy-vm-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'deploy' }}
    steps:
      - name: SSH pull main and run deploy-vm.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          # Keep this block minimal. No single quotes (drone-ssh bash -c wrapper).
          # Full deploy logic lives in scripts/deploy-vm.sh after git reset.
          script: |
            set -euo pipefail
            REPO_DIR=/home/azureuser/speechAgent
            cd ${REPO_DIR}
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git pull --ff-only origin main
            echo Now at: $(git log -1 --oneline)
            test -f ${REPO_DIR}/scripts/deploy-vm.sh
            chmod +x ${REPO_DIR}/scripts/deploy-vm.sh
            bash ${REPO_DIR}/scripts/deploy-vm.sh
